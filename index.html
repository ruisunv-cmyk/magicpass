<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Pass Hike Planner | Swiss Alps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #e8f0e8, #d4e0d4);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; }
        .logo { font-size: 28px; font-weight: bold; color: #2d6a4f; }
        .nav { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .nav button { padding: 10px 20px; border: none; background: white; border-radius: 40px; cursor: pointer; font-weight: 500; }
        .nav button.active { background: #2d6a4f; color: white; }
        .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 20px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; color: #2d6a4f; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .btn { background: #2d6a4f; color: white; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid #2d6a4f; color: #2d6a4f; padding: 6px 16px; border-radius: 40px; cursor: pointer; }
        .hike-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .filter-group { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 5px 12px; border: 1px solid #ddd; background: white; border-radius: 20px; cursor: pointer; }
        .filter-btn.active { background: #2d6a4f; color: white; border-color: #2d6a4f; }
        .page { display: none; }
        .page.active { display: block; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #666; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        @media (max-width: 700px) { .stats { grid-template-columns: repeat(2,1fr); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">🏔️ Magic Pass Hike Planner</div>
        <div class="nav">
            <button class="nav-btn active" data-page="planner">📋 Planner</button>
            <button class="nav-btn" data-page="tours">🥾 Tours</button>
            <button class="nav-btn" data-page="stats">📊 Stats</button>
        </div>
    </div>

    <div id="plannerPage" class="page active">
        <div class="stats">
            <div class="stat-card"><div class="stat-value" id="totalHikes">0</div><div>Total Hikes</div></div>
            <div class="stat-card"><div class="stat-value" id="completedHikes">0</div><div>Completed</div></div>
            <div class="stat-card"><div class="stat-value" id="totalKm">0</div><div>Total KM</div></div>
            <div class="stat-card"><div class="stat-value" id="totalElev">0</div><div>Elevation (m)</div></div>
        </div>
        <div class="card">
            <div class="card-header"><h3>My Hikes</h3><button class="btn" onclick="openAddModal()">+ Add Hike</button></div>
            <div class="filter-group" id="plannerFilters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="planned">Planned</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="valais">Valais</button>
                <button class="filter-btn" data-filter="vaud">Vaud</button>
                <button class="filter-btn" data-filter="bern">Bern</button>
            </div>
            <div id="hikesList"></div>
        </div>
    </div>

    <div id="toursPage" class="page">
        <div class="card">
            <div class="card-header"><h3>Recommended Magic Pass Hikes</h3></div>
            <div class="filter-group" id="toursFilters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="Easy">Easy</button>
                <button class="filter-btn" data-filter="Moderate">Moderate</button>
                <button class="filter-btn" data-filter="Hard">Hard</button>
            </div>
            <div id="toursList"></div>
        </div>
    </div>

    <div id="statsPage" class="page">
        <div class="card">
            <div class="card-header"><h3>Statistics</h3></div>
            <canvas id="statsChart" style="max-height: 300px; margin-bottom: 20px;"></canvas>
            <div id="statsDetails"></div>
        </div>
        <div class="card">
            <div class="card-header"><h3>Data</h3></div>
            <button class="btn-outline" onclick="exportData()">📥 Export Backup</button>
            <button class="btn-outline" onclick="document.getElementById('importFile').click()">📤 Restore Backup</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(this)">
            <p style="margin-top: 15px; font-size: 12px; color: #666;">💡 Export from one device, import on another to sync</p>
        </div>
    </div>
</div>

<div id="hikeModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Add Hike</h3>
        <div class="form-group"><label>Hike Name</label><input type="text" id="hikeName" placeholder="e.g., Zermatt - Riffelsee"></div>
        <div class="form-group"><label>Region</label><select id="hikeRegion"><option value="valais">Valais</option><option value="vaud">Vaud</option><option value="bern">Bern</option></select></div>
        <div class="form-group"><label>Distance (km)</label><input type="number" id="hikeDistance" step="0.5"></div>
        <div class="form-group"><label>Elevation (m)</label><input type="number" id="hikeElevation"></div>
        <div class="form-group"><label>Duration (hours)</label><input type="number" id="hikeDuration" step="0.5"></div>
        <div class="form-group"><label>Difficulty</label><select id="hikeDifficulty"><option>Easy</option><option>Moderate</option><option>Hard</option></select></div>
        <div class="form-group"><label>Notes</label><textarea id="hikeNotes" rows="2"></textarea></div>
        <div class="modal-actions">
            <button class="btn-outline" onclick="closeModal()">Cancel</button>
            <button class="btn" onclick="saveHike()">Save</button>
            <button class="btn-outline" id="deleteBtn" style="display:none; color:#c97e5a;" onclick="deleteHike()">Delete</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    let hikes = [
        { id: 1, name: "Zermatt - Riffelsee", region: "valais", distance: 9.5, elevation: 450, duration: 3.5, difficulty: "Easy", notes: "Start from Gornergrat", completed: false },
        { id: 2, name: "Verbier - Lac de Louvie", region: "valais", distance: 12, elevation: 620, duration: 4.5, difficulty: "Moderate", notes: "Mountain lake", completed: false },
        { id: 3, name: "Grindelwald - Bachalpsee", region: "bern", distance: 8, elevation: 380, duration: 3, difficulty: "Easy", notes: "Eiger view", completed: true },
        { id: 4, name: "Glacier 3000", region: "vaud", distance: 11, elevation: 520, duration: 4, difficulty: "Moderate", notes: "Suspension bridge", completed: false }
    ];
    let nextId = 5, currentPlannerFilter = 'all', currentToursFilter = 'all', chart, editId = null;

    const tours = [
        { name: "Zermatt - Gornergrat Panorama", region: "valais", distance: 11.5, elevation: 350, duration: 4, difficulty: "Easy", lift: "Gornergratbahn", desc: "Matterhorn views" },
        { name: "Verbier - Mont Fort", region: "valais", distance: 13, elevation: 650, duration: 5, difficulty: "Moderate", lift: "Verbier Cable Car", desc: "Highest peak" },
        { name: "Grindelwald - First", region: "bern", distance: 7.5, elevation: 300, duration: 2.5, difficulty: "Easy", lift: "Firstbahn", desc: "Classic Swiss panorama" },
        { name: "Kandersteg - Oeschinensee", region: "bern", distance: 9, elevation: 420, duration: 3.5, difficulty: "Moderate", lift: "Oeschinensee Bahn", desc: "Turquoise lake" }
    ];

    function updateStats() {
        document.getElementById('totalHikes').innerText = hikes.length;
        document.getElementById('completedHikes').innerText = hikes.filter(h => h.completed).length;
        document.getElementById('totalKm').innerText = hikes.reduce((s,h)=>s+h.distance,0).toFixed(0);
        document.getElementById('totalElev').innerText = hikes.reduce((s,h)=>s+h.elevation,0);
    }

    function renderHikes() {
        let filtered = hikes;
        if (currentPlannerFilter === 'planned') filtered = hikes.filter(h => !h.completed);
        else if (currentPlannerFilter === 'completed') filtered = hikes.filter(h => h.completed);
        else if (['valais','vaud','bern'].includes(currentPlannerFilter)) filtered = hikes.filter(h => h.region === currentPlannerFilter);
        
        const container = document.getElementById('hikesList');
        if (filtered.length === 0) { container.innerHTML = '<p style="text-align:center;padding:40px;">No hikes</p>'; return; }
        container.innerHTML = filtered.map(h => `
            <div class="hike-item">
                <div>
                    <strong>${h.name}</strong> <span style="background:#e8f0e8;padding:2px 8px;border-radius:12px;font-size:11px;">${h.region.toUpperCase()}</span>
                    ${h.completed ? ' ✅' : ' ⏳'}
                    <div style="font-size:12px;color:#666;">${h.distance}km | ${h.elevation}m | ${h.duration}h | ${h.difficulty}</div>
                    ${h.notes ? `<div style="font-size:11px;color:#888;">💡 ${h.notes.substring(0,50)}</div>` : ''}
                </div>
                <div>
                    <button class="btn-outline" onclick="toggleComplete(${h.id})" style="padding:4px 12px;">${h.completed ? 'Undo' : 'Done'}</button>
                    <button class="btn-outline" onclick="openEditModal(${h.id})" style="padding:4px 12px;">✏️</button>
                </div>
            </div>
        `).join('');
    }

    function renderTours() {
        let filtered = currentToursFilter === 'all' ? tours : tours.filter(t => t.difficulty === currentToursFilter);
        const container = document.getElementById('toursList');
        container.innerHTML = filtered.map(t => `
            <div class="hike-item">
                <div>
                    <strong>${t.name}</strong> <span style="background:#e8f0e8;padding:2px 8px;border-radius:12px;font-size:11px;">${t.region.toUpperCase()}</span>
                    <div style="font-size:12px;">${t.distance}km | ${t.elevation}m | ${t.duration}h | ${t.difficulty}</div>
                    <div style="font-size:11px;color:#666;">🚠 ${t.lift} - ${t.desc}</div>
                </div>
                <div><button class="btn" onclick="addTour('${t.name}','${t.region}',${t.distance},${t.elevation},${t.duration},'${t.difficulty}')" style="padding:6px 16px;">+ Add</button></div>
            </div>
        `).join('');
    }

    function addTour(name, region, distance, elevation, duration, difficulty) {
        hikes.push({ id: nextId++, name, region, distance, elevation, duration, difficulty, notes: "Magic Pass tour", completed: false });
        refreshAll(); saveData();
        alert(`✅ "${name}" added!`);
    }

    function toggleComplete(id) { let h = hikes.find(h => h.id === id); if(h) h.completed = !h.completed; refreshAll(); saveData(); }
    function openAddModal() { editId = null; document.getElementById('modalTitle').innerText = 'Add Hike'; clearForm(); document.getElementById('deleteBtn').style.display = 'none'; document.getElementById('hikeModal').classList.add('active'); }
    function openEditModal(id) { let h = hikes.find(h => h.id === id); if(!h) return; editId = id; document.getElementById('modalTitle').innerText = 'Edit Hike'; document.getElementById('hikeName').value = h.name; document.getElementById('hikeRegion').value = h.region; document.getElementById('hikeDistance').value = h.distance; document.getElementById('hikeElevation').value = h.elevation; document.getElementById('hikeDuration').value = h.duration; document.getElementById('hikeDifficulty').value = h.difficulty; document.getElementById('hikeNotes').value = h.notes || ''; document.getElementById('deleteBtn').style.display = 'inline-block'; document.getElementById('hikeModal').classList.add('active'); }
    function clearForm() { ['hikeName','hikeDistance','hikeElevation','hikeDuration','hikeNotes'].forEach(id => document.getElementById(id).value = ''); document.getElementById('hikeRegion').value = 'valais'; document.getElementById('hikeDifficulty').value = 'Easy'; }
    function saveHike() { let name = document.getElementById('hikeName').value.trim(); if(!name) { alert("Enter name"); return; } let data = { name, region: document.getElementById('hikeRegion').value, distance: parseFloat(document.getElementById('hikeDistance').value), elevation: parseInt(document.getElementById('hikeElevation').value), duration: parseFloat(document.getElementById('hikeDuration').value), difficulty: document.getElementById('hikeDifficulty').value, notes: document.getElementById('hikeNotes').value, completed: false }; if(editId) { let idx = hikes.findIndex(h => h.id === editId); if(idx !== -1) hikes[idx] = { ...hikes[idx], ...data }; } else hikes.push({ id: nextId++, ...data }); closeModal(); refreshAll(); saveData(); }
    function deleteHike() { if(editId && confirm("Delete?")) { hikes = hikes.filter(h => h.id !== editId); closeModal(); refreshAll(); saveData(); } }
    function closeModal() { document.getElementById('hikeModal').classList.remove('active'); editId = null; }
    function refreshAll() { updateStats(); renderHikes(); renderTours(); updateChart(); }
    function updateChart() { let regions = { valais:0, vaud:0, bern:0 }; hikes.forEach(h => { if(regions[h.region] !== undefined) regions[h.region]++; }); if(chart) chart.destroy(); let ctx = document.getElementById('statsChart').getContext('2d'); chart = new Chart(ctx, { type: 'bar', data: { labels: ['Valais','Vaud','Bern'], datasets: [{ label: 'Hikes', data: [regions.valais, regions.vaud, regions.bern], backgroundColor: '#2d6a4f', borderRadius: 8 }] }, options: { responsive: true } }); let completed = hikes.filter(h => h.completed).length; document.getElementById('statsDetails').innerHTML = `<div style="text-align:center;padding:20px;background:#e8f0e8;border-radius:16px;">🏆 ${completed} / ${hikes.length} hikes completed (${Math.round(completed/hikes.length*100)}%)</div>`; }
    function saveData() { localStorage.setItem('magicHikes', JSON.stringify(hikes)); }
    function loadData() { let saved = localStorage.getItem('magicHikes'); if(saved) { hikes = JSON.parse(saved); nextId = Math.max(...hikes.map(h => h.id), 0) + 1; } }
    function exportData() { let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ hikes })], {type:"application/json"})); a.download = `hikes-${new Date().toISOString().split('T')[0]}.json`; a.click(); URL.revokeObjectURL(a.href); alert("✅ Exported!"); }
    function importData(input) { let file = input.files[0]; if(!file) return; let reader = new FileReader(); reader.onload = e => { try { let imported = JSON.parse(e.target.result); if(imported.hikes) { hikes = imported.hikes; refreshAll(); saveData(); alert(`✅ Imported ${hikes.length} hikes!`); } } catch(err) { alert("Invalid file"); } input.value = ''; }; reader.readAsText(file); }

    document.querySelectorAll('.nav-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(btn.getAttribute('data-page') + 'Page').classList.add('active'); document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); if(btn.getAttribute('data-page') === 'stats') updateChart(); }; });
    document.querySelectorAll('#plannerFilters .filter-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('#plannerFilters .filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentPlannerFilter = btn.getAttribute('data-filter'); renderHikes(); }; });
    document.querySelectorAll('#toursFilters .filter-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('#toursFilters .filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentToursFilter = btn.getAttribute('data-filter'); renderTours(); }; });

    loadData(); refreshAll();
</script>
</body>
</html>
