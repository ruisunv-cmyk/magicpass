<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Pass Hike Planner | Swiss Alps</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #e8f0e8 0%, #d4e0d4 100%);
            font-family: 'Inter', sans-serif;
            color: #1a3a2a;
            min-height: 100vh;
        }
        .header {
            background: rgba(255, 255, 248, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #c8d8c0;
            padding: 16px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background: linear-gradient(135deg, #2d6a4f, #40916c);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.3);
        }
        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 600;
            color: #2d6a4f;
        }
        .logo-text small {
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
            color: #6b8c6b;
            display: block;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-tab {
            padding: 8px 20px;
            border: none;
            background: transparent;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #4a6a4a;
            border-radius: 40px;
            transition: all 0.2s;
        }
        .nav-tab.active {
            background: #2d6a4f;
            color: white;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 40px;
        }
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: rgba(255,255,248,0.9);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 24px;
            text-align: center;
            border-bottom: 3px solid #40916c;
        }
        .stat-icon { font-size: 32px; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; color: #2d6a4f; }
        .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6b8c6b; margin-top: 4px; }
        .card {
            background: rgba(255,255,248,0.9);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #d4e4d0;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            color: #2d6a4f;
        }
        .btn-primary {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 12px;
            transition: 0.25s;
        }
        .btn-primary:hover { background: #1b4d3e; transform: translateY(-1px); }
        .btn-secondary {
            background: transparent;
            color: #2d6a4f;
            border: 1px solid #c8d8c0;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-danger {
            background: transparent;
            color: #c97e5a;
            border: 1px solid #e8d4c8;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 11px;
        }
        .hike-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #d4e4d0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hike-item:hover { background: #f0f8f0; padding-left: 10px; border-radius: 16px; }
        .difficulty-easy { color: #40916c; font-weight: 600; }
        .difficulty-moderate { color: #e9b35f; font-weight: 600; }
        .difficulty-hard { color: #c97e5a; font-weight: 600; }
        .region-tag {
            display: inline-block;
            background: #e8f0e8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #2d6a4f;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 58, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fffef8;
            padding: 32px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 28px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: #6b8c6b;
            text-transform: uppercase;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d4e4d0;
            border-radius: 16px;
            font-size: 13px;
            font-family: inherit;
            background: white;
        }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .filter-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 16px;
            border: 1px solid #d4e4d0;
            background: transparent;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
        }
        .filter-btn.active { background: #2d6a4f; color: white; border-color: #2d6a4f; }
        .complete-btn {
            background: #2d6a4f20;
            border: 1px solid #2d6a4f;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
        }
        .complete-btn:hover { background: #2d6a4f; color: white; }
        @media (max-width: 900px) { .hero-stats { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .container { padding: 16px; } .header { padding: 12px 20px; } }
    </style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="logo">
            <div class="logo-icon">🏔️</div>
            <div class="logo-text">Magic Pass Hike<br><small>Swiss Alps Adventure Planner</small></div>
        </div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="planner">🗺️ PLANNER</button>
            <button class="nav-tab" data-page="tours">🥾 TOURS</button>
            <button class="nav-tab" data-page="stats">📊 STATS</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="plannerPage" class="page active">
        <div class="hero-stats">
            <div class="stat-card"><div class="stat-icon">🏔️</div><div class="stat-value" id="totalHikes">0</div><div class="stat-label">Total Hikes</div></div>
            <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="completedHikes">0</div><div class="stat-label">Completed</div></div>
            <div class="stat-card"><div class="stat-icon">📏</div><div id="totalKm" class="stat-value">0</div><div class="stat-label">Total KM</div></div>
            <div class="stat-card"><div class="stat-icon">⬆️</div><div id="totalElevation" class="stat-value">0</div><div class="stat-label">Elevation (m)</div></div>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-plus-circle"></i> My Hikes</div>
                <button class="btn-primary" onclick="openAddHikeModal()">+ Add Hike</button>
            </div>
            <div class="filter-buttons" id="plannerFilters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="planned">Planned</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="valais">Valais</button>
                <button class="filter-btn" data-filter="vaud">Vaud</button>
                <button class="filter-btn" data-filter="bern">Bern</button>
            </div>
            <div id="hikesList"></div>
        </div>
    </div>

    <div id="toursPage" class="page">
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-mountain"></i> Magic Pass Recommended Hikes</div>
            </div>
            <div class="filter-buttons" id="toursFilters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="Easy">Easy</button>
                <button class="filter-btn" data-filter="Moderate">Moderate</button>
                <button class="filter-btn" data-filter="Hard">Hard</button>
            </div>
            <div id="toursList"></div>
        </div>
    </div>

    <div id="statsPage" class="page">
        <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-chart-line"></i> Hiking Statistics</div></div>
            <canvas id="statsChart" style="max-height: 280px; margin-bottom: 24px;"></canvas>
            <div id="statsDetails"></div>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-download"></i> Data Management</div></div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn-secondary" onclick="exportData()"><i class="fas fa-download"></i> Export Backup</button>
                <button class="btn-secondary" onclick="document.getElementById('importFile').click()"><i class="fas fa-upload"></i> Restore Backup</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(this)">
            </div>
            <p style="font-size: 11px; color: #6b8c6b; margin-top: 16px;">💡 Export from one device, import on another to sync your hikes</p>
        </div>
    </div>
</div>

<div id="hikeModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-bottom: 20px; font-family: 'Cormorant Garamond', serif; font-size: 26px; color: #2d6a4f;">Add Hike</h3>
        <div class="form-group"><label>🏔️ Hike Name</label><input type="text" id="hikeName" placeholder="e.g., Zermatt - Riffelsee"></div>
        <div class="form-group"><label>📍 Region</label><select id="hikeRegion"><option value="valais">Valais</option><option value="vaud">Vaud</option><option value="bern">Bernese Oberland</option></select></div>
        <div class="form-group"><label>📏 Distance (km)</label><input type="number" id="hikeDistance" step="0.5" placeholder="e.g., 12.5"></div>
        <div class="form-group"><label>⬆️ Elevation Gain (m)</label><input type="number" id="hikeElevation" placeholder="e.g., 850"></div>
        <div class="form-group"><label>⏱️ Duration (hours)</label><input type="number" id="hikeDuration" step="0.5" placeholder="e.g., 4.5"></div>
        <div class="form-group"><label>⭐ Difficulty</label><select id="hikeDifficulty"><option value="Easy">Easy 🟢</option><option value="Moderate">Moderate 🟡</option><option value="Hard">Hard 🔴</option></select></div>
        <div class="form-group"><label>📅 Date Planned</label><input type="date" id="hikeDate"></div>
        <div class="form-group"><label>📝 Notes</label><textarea id="hikeNotes" rows="2" placeholder="Starting point, cable car, tips..."></textarea></div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeHikeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveHike()">Save Hike</button>
            <button class="btn-danger" id="deleteHikeBtn" style="display:none;" onclick="deleteCurrentHike()">Delete</button>
        </div>
    </div>
</div>

<script>
    let hikes = [
        { id: 1, name: "Zermatt - Riffelsee Lake", region: "valais", distance: 9.5, elevation: 450, duration: 3.5, difficulty: "Easy", date: "2025-07-15", notes: "Start from Gornergrat station", completed: false },
        { id: 2, name: "Verbier - Lac de Louvie", region: "valais", distance: 12, elevation: 620, duration: 4.5, difficulty: "Moderate", date: "2025-07-20", notes: "Mountain lake", completed: false },
        { id: 3, name: "Grindelwald - Bachalpsee", region: "bern", distance: 8, elevation: 380, duration: 3, difficulty: "Easy", date: "2025-08-01", notes: "Famous lake with Eiger view", completed: true },
        { id: 4, name: "Les Diablerets - Glacier 3000", region: "vaud", distance: 11, elevation: 520, duration: 4, difficulty: "Moderate", date: "2025-08-10", notes: "Peak walk", completed: false },
        { id: 5, name: "Mürren - Rotstockhütte", region: "bern", distance: 14, elevation: 780, duration: 5.5, difficulty: "Hard", date: "2025-08-20", notes: "Via ferrata option", completed: false }
    ];
    let nextId = 6, chart, currentPlannerFilter = 'all', currentToursFilter = 'all';

    const magicTours = [
        { name: "Zermatt - Gornergrat Panorama Trail", region: "valais", distance: 11.5, elevation: 350, duration: 4, difficulty: "Easy", lift: "Gornergratbahn", description: "Matterhorn views" },
        { name: "Verbier - Mont Fort", region: "valais", distance: 13, elevation: 650, duration: 5, difficulty: "Moderate", lift: "Verbier Cable Car", description: "Highest peak" },
        { name: "Saas-Fee - Mittelallalin", region: "valais", distance: 8, elevation: 280, duration: 3, difficulty: "Easy", lift: "Metro Alpin", description: "Highest underground funicular" },
        { name: "Grindelwald - First to Bachalpsee", region: "bern", distance: 7.5, elevation: 300, duration: 2.5, difficulty: "Easy", lift: "Firstbahn", description: "Classic Swiss panorama" },
        { name: "Les Diablerets - Sex Rouge", region: "vaud", distance: 10, elevation: 480, duration: 3.5, difficulty: "Moderate", lift: "Glacier 3000", description: "Glacier walk" },
        { name: "Kandersteg - Oeschinensee", region: "bern", distance: 9, elevation: 420, duration: 3.5, difficulty: "Moderate", lift: "Oeschinensee Bahn", description: "Turquoise lake" }
    ];

    function updateStats() {
        document.getElementById('totalHikes').innerText = hikes.length;
        document.getElementById('completedHikes').innerText = hikes.filter(h => h.completed).length;
        document.getElementById('totalKm').innerText = hikes.reduce((s, h) => s + h.distance, 0).toFixed(0);
        document.getElementById('totalElevation').innerText = hikes.reduce((s, h) => s + h.elevation, 0);
    }

    function renderHikes() {
        let filtered = hikes;
        if (currentPlannerFilter === 'planned') filtered = hikes.filter(h => !h.completed);
        else if (currentPlannerFilter === 'completed') filtered = hikes.filter(h => h.completed);
        else if (['valais', 'vaud', 'bern'].includes(currentPlannerFilter)) filtered = hikes.filter(h => h.region === currentPlannerFilter);
        const container = document.getElementById('hikesList');
        if (filtered.length === 0) { container.innerHTML = '<p style="text-align:center; padding:40px;">No hikes found.</p>'; return; }
        container.innerHTML = filtered.map(h => `
            <div class="hike-item">
                <div style="flex:1;">
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                        <strong>${h.name}</strong>
                        <span class="region-tag">${h.region.toUpperCase()}</span>
                        ${h.completed ? '<span style="color:#40916c;">✓ Completed</span>' : '<span style="color:#e9b35f;">⏳ Planned</span>'}
                    </div>
                    <div style="font-size:12px; color:#6b8c6b; margin-top:4px;">
                        📏 ${h.distance} km | ⬆️ ${h.elevation} m | ⏱️ ${h.duration} h | <span class="difficulty-${h.difficulty.toLowerCase()}">${h.difficulty}</span>
                    </div>
                    ${h.notes ? `<div style="font-size:11px; color:#8aa88a; margin-top:4px;">💡 ${h.notes.substring(0, 60)}</div>` : ''}
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="complete-btn" onclick="toggleComplete(${h.id})">${h.completed ? '↺ Undo' : '✓ Complete'}</button>
                    <button class="btn-secondary" onclick="openEditHike(${h.id})" style="padding:4px 12px;">✏️</button>
                </div>
            </div>
        `).join('');
    }

    function renderTours() {
        let filtered = currentToursFilter === 'all' ? magicTours : magicTours.filter(t => t.difficulty === currentToursFilter);
        const container = document.getElementById('toursList');
        container.innerHTML = filtered.map(t => `
            <div class="hike-item">
                <div style="flex:1;">
                    <div><strong>${t.name}</strong> <span class="region-tag">${t.region.toUpperCase()}</span></div>
                    <div style="font-size:12px; margin:4px 0;">📏 ${t.distance} km | ⬆️ ${t.elevation} m | ⏱️ ${t.duration} h | ${t.difficulty}</div>
                    <div style="font-size:11px;">🚠 ${t.lift} - ${t.description}</div>
                </div>
                <div><button class="btn-primary" onclick="quickAdd('${t.name}', '${t.region}', ${t.distance}, ${t.elevation}, ${t.duration}, '${t.difficulty}')" style="padding:6px 16px;">+ Add</button></div>
            </div>
        `).join('');
    }

    function quickAdd(name, region, distance, elevation, duration, difficulty) {
        hikes.push({ id: nextId++, name, region, distance, elevation, duration, difficulty, date: "", notes: "Magic Pass tour", completed: false });
        refreshAll(); saveToLocalStorage();
        alert(`✅ "${name}" added!`);
    }

    function toggleComplete(id) { const h = hikes.find(h => h.id === id); if (h) h.completed = !h.completed; refreshAll(); saveToLocalStorage(); }
    function updateChart() {
        const regions = { valais: 0, vaud: 0, bern: 0 }, diffs = { Easy: 0, Moderate: 0, Hard: 0 };
        hikes.forEach(h => { if (regions[h.region] !== undefined) regions[h.region]++; diffs[h.difficulty]++; });
        if (chart) chart.destroy();
        const ctx = document.getElementById('statsChart').getContext('2d');
        chart = new Chart(ctx, { type: 'bar', data: { labels: ['Valais', 'Vaud', 'Bern'], datasets: [{ label: 'Hikes by Region', data: [regions.valais, regions.vaud, regions.bern], backgroundColor: '#40916c', borderRadius: 8 }] }, options: { responsive: true } });
        document.getElementById('statsDetails').innerHTML = `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; text-align:center; margin-top:20px;"><div><span style="font-size:28px; font-weight:700;">${diffs.Easy}</span><br>Easy</div><div><span style="font-size:28px; font-weight:700;">${diffs.Moderate}</span><br>Moderate</div><div><span style="font-size:28px; font-weight:700;">${diffs.Hard}</span><br>Hard</div></div><div style="margin-top:20px; padding:16px; background:#e8f0e8; border-radius:16px; text-align:center;">🏆 ${hikes.filter(h => h.completed).length} / ${hikes.length} completed</div>`;
    }

    function openAddHikeModal() {
        document.getElementById('modalTitle').innerText = 'Add New Hike';
        ['hikeName','hikeDistance','hikeElevation','hikeDuration','hikeDate','hikeNotes'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('hikeRegion').value = 'valais';
        document.getElementById('hikeDifficulty').value = 'Easy';
        document.getElementById('deleteHikeBtn').style.display = 'none';
        window.editHikeId = null;
        document.getElementById('hikeModal').classList.add('active');
    }

    function openEditHike(id) {
        const h = hikes.find(x => x.id === id);
        if (!h) return;
        document.getElementById('modalTitle').innerText = 'Edit Hike';
        document.getElementById('hikeName').value = h.name;
        document.getElementById('hikeRegion').value = h.region;
        document.getElementById('hikeDistance').value = h.distance;
        document.getElementById('hikeElevation').value = h.elevation;
        document.getElementById('hikeDuration').value = h.duration;
        document.getElementById('hikeDifficulty').value = h.difficulty;
        document.getElementById('hikeDate').value = h.date || '';
        document.getElementById('hikeNotes').value = h.notes || '';
        document.getElementById('deleteHikeBtn').style.display = 'inline-block';
        window.editHikeId = id;
        document.getElementById('hikeModal').classList.add('active');
    }

    function saveHike() {
        const name = document.getElementById('hikeName').value.trim();
        const region = document.getElementById('hikeRegion').value;
        const distance = parseFloat(document.getElementById('hikeDistance').value);
        const elevation = parseInt(document.getElementById('hikeElevation').value);
        const duration = parseFloat(document.getElementById('hikeDuration').value);
        const difficulty = document.getElementById('hikeDifficulty').value;
        const date = document.getElementById('hikeDate').value;
        const notes = document.getElementById('hikeNotes').value;
        if (!name || isNaN(distance) || isNaN(elevation) || isNaN(duration)) { alert("Please fill all required fields"); return; }
        if (window.editHikeId) {
            const idx = hikes.findIndex(x => x.id === window.editHikeId);
            if (idx !== -1) hikes[idx] = { ...hikes[idx], name, region, distance, elevation, duration, difficulty, date, notes };
        } else hikes.push({ id: nextId++, name, region, distance, elevation, duration, difficulty, date, notes, completed: false });
        closeHikeModal(); refreshAll(); saveToLocalStorage();
    }

    function deleteCurrentHike() { if (window.editHikeId && confirm("Delete this hike?")) { hikes = hikes.filter(h => h.id !== window.editHikeId); closeHikeModal(); refreshAll(); saveToLocalStorage(); } }
    function closeHikeModal() { document.getElementById('hikeModal').classList.remove('active'); }
    function refreshAll() { updateStats(); renderHikes(); renderTours(); updateChart(); }
    function saveToLocalStorage() { localStorage.setItem('magicPassHikes', JSON.stringify(hikes)); }
    function loadFromLocalStorage() { const saved = localStorage.getItem('magicPassHikes'); if (saved) { hikes = JSON.parse(saved); nextId = Math.max(...hikes.map(h => h.id), 0) + 1; } }

    function exportData() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ hikes }, null, 2)], { type: "application/json" })); a.download = `magic-pass-hikes-${new Date().toISOString().split('T')[0]}.json`; a.click(); URL.revokeObjectURL(a.href); alert("✅ Exported!"); }
    function importData(input) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = e => { try { const imported = JSON.parse(e.target.result); if (imported.hikes) { hikes = imported.hikes; refreshAll(); saveToLocalStorage(); alert(`✅ Imported ${hikes.length} hikes!`); } } catch(err) { alert("Invalid file"); } input.value = ''; }; reader.readAsText(file); }

    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageName + 'Page').classList.add('active');
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        const clicked = Array.from(document.querySelectorAll('.nav-tab')).find(t => t.getAttribute('data-page') === pageName);
        if (clicked) clicked.classList.add('active');
        if (pageName === 'stats') updateChart();
    }

    document.querySelectorAll('.nav-tab').forEach(btn => { btn.onclick = () => showPage(btn.getAttribute('data-page')); });
    document.querySelectorAll('#plannerFilters .filter-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('#plannerFilters .filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentPlannerFilter = btn.getAttribute('data-filter'); renderHikes(); }; });
    document.querySelectorAll('#toursFilters .filter-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('#toursFilters .filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentToursFilter = btn.getAttribute('data-filter'); renderTours(); }; });

    window.openAddHikeModal = openAddHikeModal; window.openEditHike = openEditHike; window.closeHikeModal = closeHikeModal;
    window.saveHike = saveHike; window.deleteCurrentHike = deleteCurrentHike; window.toggleComplete = toggleComplete;
    window.quickAdd = quickAdd; window.exportData = exportData; window.importData = importData;

    loadFromLocalStorage(); refreshAll();
</script>
</body>
</html>
